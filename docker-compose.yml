services:
  db:
    image: postgres:16-alpine
    container_name: teste-tecnico-db
    environment:
      POSTGRES_DB: product_catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/init/01-init-products.sql:/docker-entrypoint-initdb.d/01-init-products.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teste-tecnico-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=product_catalog;Username=postgres;Password=password
    ports:
      - "5000:8080"
    restart: unless-stopped

volumes:
  postgres_data: